services:
  coze-on-wechat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coze-on-wechat
    restart: always
    ports:
      - "8501:8501"
      - "9919:9919"
    volumes:
      - ./config.json:/app/config.json
    environment:
      - TZ=Asia/Shanghai  # 可选：部分镜像需同时设置环境变量
    depends_on:
      - gewechat
    networks:
      - coze-network

  gewechat:
    image: registry.cn-chengdu.aliyuncs.com/tu1h/wechotd:alpine
    container_name: gewechat
    restart: always
    ports:
      - "2531:2531"
      - "2532:2532"
    volumes:
      - ./gewechat/data:/root/temp
    environment:
      - TZ=Asia/Shanghai  # 可选：部分镜像需同时设置环境变量
    networks:
      - coze-network

networks:
  coze-network:
    driver: bridge 
